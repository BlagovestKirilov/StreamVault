# fly.toml app configuration file generated for streamvault on 2026-05-26T23:00:06+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'streamvault'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 7000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[mounts]
  source = "data"
  destination = "/data"

[env]
  NODE_OPTIONS = "--max-old-space-size=640"

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
